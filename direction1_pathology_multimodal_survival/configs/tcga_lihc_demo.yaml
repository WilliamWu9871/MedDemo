# Direction 1 Default Demo Config — TCGA-LIHC (matches Paper 1: Hepatocellular Carcinoma)
experiment:
  name: tcga_lihc_demo
  project: TCGA-LIHC
  n_patients: 70
  slide_type: Diagnostic Slide
  min_os_days: 1
  max_slide_mb: 800

paths:
  wsi_dir: data/tcga_lihc/svs
  metadata_dir: data/tcga_lihc/metadata
  clinical_csv: data/tcga_lihc/metadata/clinical.csv
  trident_job_dir: outputs/tcga_lihc/trident_feats
  splits_csv: splits/tcga_lihc_splits.csv
  priors_csv: outputs/tcga_lihc/priors/slide_priors.csv
  ablation_dir: outputs/tcga_lihc/ablation
  attention_dir: outputs/tcga_lihc/attention
  report_dir: outputs/tcga_lihc/report
  thumbnails_dir: data/tcga_lihc/thumbnails

trident:
  patch_encoder: hibou_l
  fallback_encoder: resnet50
  mag: 20
  patch_size: 224
  remove_artifacts: true
  remove_penmarks: true
  batch_size: 256

splits:
  n_splits: 5
  seeds: [42, 123, 2026]
  default_seed: 42

prior:
  backend: kather_probe        # kather_probe | color_heuristic | tiatoolbox
  kather_dataset: DykeF/NCTCRCHE100K
  max_samples_per_class: 400
  tsr_num_bins: 8

data:
  clinical_cols: [age, sex, stage]
  max_patches_train: 8192
  max_patches_eval: null

model:
  n_bins: 4
  hidden_dim: 256
  n_heads: 4
  dropout: 0.25

training:
  batch_size: 1
  grad_accum_steps: 16
  epochs: 25
  lr: 2.0e-4
  weight_decay: 1.0e-4
  nll_alpha: 0.15
  early_stop_patience: 8
  num_workers: 0

evaluation:
  heatmap_num_slides: 4
  bg_rgb_threshold: 225
  bg_warn_fraction: 0.20
  rcs_knots_percentiles: [5, 35, 65, 95]
